name: echo_talk
description: "Echo - Talk to Strangers Live Audio Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.10.6
  socket_io_client: ^2.0.3+1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.4
  url_launcher: ^6.2.5
  http: ^1.2.1
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
