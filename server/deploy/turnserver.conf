# coturn config for Echo (install coturn on a small VPS: sudo apt install coturn)
# Copy to /etc/turnserver.conf, fill the 3 lines marked CHANGE, then: sudo systemctl enable --now coturn
# Open firewall: UDP+TCP 3478, UDP+TCP 5349 (if using TLS), UDP 49152-65535.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_same_value_as_TURN_SECRET_on_the_Echo_server
realm=turn.yourdomain.com                # CHANGE
external-ip=YOUR_SERVER_PUBLIC_IP        # CHANGE
min-port=49152
max-port=65535
total-quota=200
stale-nonce=600
no-multicast-peers
no-cli

# Never let callers reach the server's own network
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS (turns:) is optional; get a free certificate with certbot, then uncomment:
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem
