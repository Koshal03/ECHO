# Render Blueprint: put this file in the ROOT of your GitHub repo (next to the "server" folder).
# Render > New > Blueprint > pick the repo. Then fill the variables marked "sync: false".
# If your repo contains only the server files (no "server" folder), delete the rootDir line.
services:
  - type: web
    name: echo-server
    runtime: node
    plan: starter            # paid plan: stays awake and can send SMTP mail. "free" sleeps and blocks SMTP.
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SERVER_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANDROID_PACKAGE_NAME
        value: com.koshal.echotalk
      - key: ADMOB_REWARDED_AD_UNIT
        value: "8634399335"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
